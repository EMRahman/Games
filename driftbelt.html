<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driftbelt</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04040c">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; min-height: 100dvh; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas {
    position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
    display: block; width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
    height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); touch-action: none;
  }
  .touch-controls { display: none; position: fixed; z-index: 5; right: max(15px, env(safe-area-inset-right)); bottom: max(15px, env(safe-area-inset-bottom)); left: max(15px, env(safe-area-inset-left)); justify-content: space-between; align-items: end; pointer-events: none; }
  .control-group { display: flex; gap: 10px; align-items: end; pointer-events: auto; }
  .touch-button {
    appearance: none; width: 62px; height: 62px; border: 1px solid rgba(155,220,255,.42); border-radius: 50%;
    background: rgba(9,24,42,.62); color: #d9f5ff; font: 800 21px/1 ui-monospace, monospace; touch-action: none;
    box-shadow: inset 0 1px rgba(255,255,255,.1), 0 6px 22px rgba(0,0,0,.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .touch-button.thrust { width: 70px; height: 70px; color: #ffc66f; border-color: rgba(255,182,85,.48); }
  .touch-button.fire { color: #8ff; border-color: rgba(100,245,255,.56); }
  .touch-button.active, .touch-button:active { transform: scale(.94); background: rgba(39,86,112,.78); }
  @media (hover: none), (pointer: coarse) { .touch-controls { display: flex; } }
  @media (max-width: 430px) { .touch-button { width: 56px; height: 56px; } .touch-button.thrust { width: 64px; height: 64px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Driftbelt game area"></canvas>
<div class="touch-controls" aria-label="Touch controls">
  <div class="control-group">
    <button class="touch-button" type="button" data-control="ArrowLeft" aria-label="Rotate left">↺</button>
    <button class="touch-button" type="button" data-control="ArrowRight" aria-label="Rotate right">↻</button>
  </div>
  <div class="control-group">
    <button class="touch-button thrust" type="button" data-control="ArrowUp" aria-label="Thrust">▲</button>
    <button class="touch-button fire" type="button" data-control="Space" aria-label="Fire">●</button>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr = 1;
function resize() {
  const bounds = canvas.getBoundingClientRect();
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.max(1, Math.round(bounds.width || innerWidth));
  H = Math.max(1, Math.round(bounds.height || innerHeight));
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
window.visualViewport?.addEventListener('resize', resize);
resize();

const keys = {};
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' && !keys.Space) wantFire = true;
  keys[e.code] = true;
  if (e.code === 'Enter' && state !== 'playing') start();
});
addEventListener('keyup', e => keys[e.code] = false);

function setControl(code, pressed) {
  if (pressed && state !== 'playing') start();
  if (code === 'Space' && pressed && !keys.Space) wantFire = true;
  keys[code] = pressed;
}
document.querySelectorAll('[data-control]').forEach(button => {
  const code = button.dataset.control;
  const release = event => { event.preventDefault(); setControl(code, false); button.classList.remove('active'); };
  button.addEventListener('pointerdown', event => {
    event.preventDefault(); button.setPointerCapture?.(event.pointerId); setControl(code, true); button.classList.add('active');
  });
  button.addEventListener('pointerup', release);
  button.addEventListener('pointercancel', release);
  button.addEventListener('lostpointercapture', () => { setControl(code, false); button.classList.remove('active'); });
});
canvas.addEventListener('pointerdown', event => { if (state !== 'playing') { event.preventDefault(); start(); } });

const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const wrap = o => {
  const m = o.r || 0;
  if (o.x < -m) o.x = W + m; else if (o.x > W + m) o.x = -m;
  if (o.y < -m) o.y = H + m; else if (o.y > H + m) o.y = -m;
};

let ship, asteroids, bullets, particles, stars, score, lives, level, state, wantFire, invuln, shake;

const stars0 = () => Array.from({length: 120}, () => ({x: rand(0, 2000), y: rand(0, 1200), s: rand(0.5, 1.8), a: rand(0.2, 1)}));
stars = stars0();

function makeShip() {
  return {x: W/2, y: H/2, vx: 0, vy: 0, a: -Math.PI/2, r: 14, cool: 0, thrust: false};
}

function makeAsteroid(x, y, r) {
  const n = 10 + (Math.random() * 4 | 0);
  const shape = Array.from({length: n}, (_, i) => ({a: i / n * TAU, d: rand(0.75, 1.15)}));
  const sp = rand(30, 80) * (60 / r) ** 0.4;
  const dir = rand(0, TAU);
  return {x, y, r, vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp, rot: 0, vr: rand(-1, 1), shape,
          hue: rand(15, 40)};
}

function spawnLevel() {
  asteroids = [];
  const count = 3 + level;
  for (let i = 0; i < count; i++) {
    let x, y;
    do { x = rand(0, W); y = rand(0, H); } while (Math.hypot(x - ship.x, y - ship.y) < 220);
    asteroids.push(makeAsteroid(x, y, 55));
  }
}

function start() {
  score = 0; lives = 3; level = 1; state = 'playing';
  ship = makeShip(); bullets = []; particles = []; invuln = 2; shake = 0; wantFire = false;
  spawnLevel();
}

// ---- particles ----
function burst(x, y, count, opts) {
  for (let i = 0; i < count; i++) {
    const a = opts.angle !== undefined ? opts.angle + rand(-opts.spread, opts.spread) : rand(0, TAU);
    const sp = rand(opts.min, opts.max);
    particles.push({
      x, y, vx: Math.cos(a) * sp + (opts.vx || 0), vy: Math.sin(a) * sp + (opts.vy || 0),
      life: 0, max: rand(opts.lifeMin, opts.lifeMax), size: rand(opts.sMin, opts.sMax),
      hue: rand(opts.hMin, opts.hMax), type: opts.type, drag: opts.drag ?? 0.98
    });
  }
}

function explode(x, y, r, vx = 0, vy = 0) {
  const k = r / 30;
  // fireball
  burst(x, y, 25 * k + 10, {min: 20, max: 160 * Math.sqrt(k), lifeMin: .4, lifeMax: 1.1, sMin: 4, sMax: 12,
        hMin: 0, hMax: 55, type: 'fire', drag: .94});
  // sparks
  burst(x, y, 30 * k + 15, {min: 100, max: 420, lifeMin: .3, lifeMax: .9, sMin: 1, sMax: 2.2,
        hMin: 40, hMax: 60, type: 'spark', drag: .96});
  // coloured debris
  burst(x, y, 12 * k + 6, {min: 40, max: 220, lifeMin: .6, lifeMax: 1.4, sMin: 1.5, sMax: 3.5,
        hMin: 180, hMax: 320, type: 'debris', drag: .97});
  // shockwave
  particles.push({x, y, vx: 0, vy: 0, life: 0, max: .5, size: r * 0.5, hue: 30, type: 'ring', drag: 1});
}

function update(dt) {
  if (state === 'playing') {
    // rotation
    if (keys.ArrowLeft) ship.a -= 4.2 * dt;
    if (keys.ArrowRight) ship.a += 4.2 * dt;
    // thrust builds momentum
    ship.thrust = !!keys.ArrowUp;
    if (ship.thrust) {
      ship.vx += Math.cos(ship.a) * 300 * dt;
      ship.vy += Math.sin(ship.a) * 300 * dt;
      const ex = ship.x - Math.cos(ship.a) * 12, ey = ship.y - Math.sin(ship.a) * 12;
      burst(ex, ey, 4, {angle: ship.a + Math.PI, spread: .3, min: 120, max: 260, lifeMin: .15, lifeMax: .4,
            sMin: 2, sMax: 5, hMin: 10, hMax: 50, type: 'fire', drag: .9, vx: ship.vx * .5, vy: ship.vy * .5});
    }
    const maxV = 700, v = Math.hypot(ship.vx, ship.vy);
    if (v > maxV) { ship.vx *= maxV / v; ship.vy *= maxV / v; }
    ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrap(ship);
    ship.cool -= dt;
    if (wantFire || (keys.Space && ship.cool <= 0)) {
      if (ship.cool <= 0) {
        bullets.push({x: ship.x + Math.cos(ship.a) * 16, y: ship.y + Math.sin(ship.a) * 16,
          vx: ship.vx + Math.cos(ship.a) * 600, vy: ship.vy + Math.sin(ship.a) * 600, life: 1.3, r: 2});
        ship.cool = .18;
      }
    }
    wantFire = false;
    if (invuln > 0) invuln -= dt;
  }

  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; wrap(b); }
  bullets = bullets.filter(b => b.life > 0);

  for (const a of asteroids) { a.x += a.vx * dt; a.y += a.vy * dt; a.rot += a.vr * dt; wrap(a); }

  // bullet vs asteroid
  for (const b of bullets) {
    for (const a of asteroids) {
      if (!a.dead && Math.hypot(a.x - b.x, a.y - b.y) < a.r) {
        a.dead = true; b.life = 0;
        score += a.r > 40 ? 20 : a.r > 25 ? 50 : 100;
        explode(a.x, a.y, a.r, a.vx, a.vy);
        shake = Math.max(shake, a.r / 6);
        if (a.r > 20) for (let i = 0; i < 2; i++) {
          const c = makeAsteroid(a.x, a.y, a.r * 0.55);
          c.vx += a.vx * .5; c.vy += a.vy * .5; asteroids.push(c);
        }
        break;
      }
    }
  }
  asteroids = asteroids.filter(a => !a.dead);

  // ship vs asteroid
  if (state === 'playing' && invuln <= 0) {
    for (const a of asteroids) {
      if (Math.hypot(a.x - ship.x, a.y - ship.y) < a.r * 0.9 + ship.r * 0.6) {
        explode(ship.x, ship.y, 40);
        shake = 14; lives--;
        if (lives <= 0) state = 'over'; else { ship = makeShip(); invuln = 2.5; }
        break;
      }
    }
  }
  if (state === 'over') ship = null;

  if (asteroids.length === 0 && state === 'playing') { level++; spawnLevel(); invuln = Math.max(invuln, 1.5); }

  for (const p of particles) {
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const d = Math.pow(p.drag, dt * 60); p.vx *= d; p.vy *= d;
    if (p.type === 'debris') p.vy += 0;
  }
  particles = particles.filter(p => p.life < p.max);
  shake *= Math.pow(0.02, dt);
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#04040c'; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = s.a * (0.7 + 0.3 * Math.sin(t / 700 + s.x));
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x % W, s.y % H, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  ctx.save();
  if (shake > 0.3) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  // asteroids
  for (const a of asteroids) {
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.beginPath();
    a.shape.forEach((p, i) => {
      const x = Math.cos(p.a) * a.r * p.d, y = Math.sin(p.a) * a.r * p.d;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
    const g = ctx.createRadialGradient(-a.r * .3, -a.r * .3, a.r * .1, 0, 0, a.r * 1.1);
    g.addColorStop(0, `hsl(${a.hue},15%,42%)`); g.addColorStop(1, `hsl(${a.hue},20%,16%)`);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = `hsl(${a.hue},25%,65%)`; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  // particles (additive)
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const k = 1 - p.life / p.max;
    if (p.type === 'fire') {
      const s = p.size * (0.4 + k);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s);
      g.addColorStop(0, `hsla(${p.hue + 20},100%,75%,${k})`);
      g.addColorStop(1, `hsla(${p.hue - 10},100%,45%,0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
    } else if (p.type === 'spark') {
      ctx.strokeStyle = `hsla(${p.hue},100%,${60 + 30 * k}%,${k})`; ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .04, p.y - p.vy * .04); ctx.stroke();
    } else if (p.type === 'debris') {
      ctx.fillStyle = `hsla(${p.hue},100%,60%,${k})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + k), 0, TAU); ctx.fill();
    } else if (p.type === 'ring') {
      ctx.strokeStyle = `hsla(${p.hue},100%,70%,${k * .7})`; ctx.lineWidth = 3 * k + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size + (1 - k) * p.size * 5, 0, TAU); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  // bullets
  for (const b of bullets) {
    ctx.shadowColor = '#7ff'; ctx.shadowBlur = 10; ctx.fillStyle = '#dff';
    ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, TAU); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // ship
  if (ship && (invuln <= 0 || Math.floor(t / 100) % 2)) {
    ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
    if (ship.thrust) { // engine flame
      const f = 10 + Math.random() * 12;
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(-8, 0, -8 - f - 8, 0);
      g.addColorStop(0, 'rgba(255,240,150,.95)'); g.addColorStop(.5, 'rgba(255,120,20,.7)'); g.addColorStop(1, 'rgba(255,40,0,0)');
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(-8, -6); ctx.lineTo(-8 - f - 8, 0); ctx.lineTo(-8, 6); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.beginPath();
    ctx.moveTo(16, 0); ctx.lineTo(-12, -11); ctx.lineTo(-7, 0); ctx.lineTo(-12, 11); ctx.closePath();
    ctx.fillStyle = '#1b2a4a'; ctx.fill();
    ctx.strokeStyle = '#8cf'; ctx.lineWidth = 2; ctx.shadowColor = '#5af'; ctx.shadowBlur = 8; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // HUD
  ctx.fillStyle = '#cde'; ctx.font = '20px monospace'; ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 20, 30);
  ctx.textAlign = 'right'; ctx.fillText('LEVEL ' + level + '   LIVES ' + '▲'.repeat(Math.max(lives, 0)), W - 20, 30);
  ctx.textAlign = 'center';
  if (state === 'title' || state === 'over') {
    ctx.font = 'bold 56px monospace'; ctx.fillStyle = '#fff';
    ctx.fillText(state === 'title' ? 'DRIFTBELT' : 'GAME OVER', W / 2, H / 2 - 20);
    ctx.font = '20px monospace'; ctx.fillStyle = '#9bd';
    if (state === 'over') ctx.fillText('Score: ' + score, W / 2, H / 2 + 15);
    const touchDevice = matchMedia('(hover: none), (pointer: coarse)').matches;
    ctx.fillText((touchDevice ? 'Tap to ' : 'Press ENTER to ') + (state === 'title' ? 'start' : 'play again'), W / 2, H / 2 + 50);
    ctx.font = '15px monospace'; ctx.fillStyle = '#678';
    ctx.fillText(touchDevice ? 'Use the controls below' : '← → rotate   ↑ thrust   SPACE fire', W / 2, H / 2 + 85);
  }
}

// init in title state with drifting asteroids
score = 0; lives = 3; level = 1; state = 'title'; bullets = []; particles = []; ship = null; invuln = 0; shake = 0;
asteroids = []; for (let i = 0; i < 6; i++) asteroids.push(makeAsteroid(rand(0, W), rand(0, H), 55));

let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 1000, 0.05); last = t;
  update(dt); draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- generation info ----
console.log('%cDriftbelt: generation info', 'font-weight:bold;font-size:14px');
console.log('Created: 2026-09-28, approx. 22:10 BST');
console.log('Model: Sonnet 5.5');
console.log('Thinking mode: medium reasoning effort');
console.log('Prompt: build me a web browser asteroid game. there\'s a simple space ship that rotates around with left and right arrow; the up arrow propells it forward. the movement forward is based on the momentum of how long "up" has been pressed. to slwo down the user must rotate the opposite way and press up. spacebar fires a small missile. aim is to blow up asteroids. asteroid if they hit the space ship it dies. in terms of detail; there should be colours of the impact when the asteriods are blownup; sparks and fire. when the rocket is moved forwad; fire should come out of the rocket engine section. if the space craft hits the edge; it flows through the oppoiste side of the screen.');
console.log('Revision: Make all the changes to derisk as much as possible (renamed from the original working title).');
console.log('Revision date: 2026-10-02');
console.log('Revision model: Claude Code');
</script>
</body>
</html>
